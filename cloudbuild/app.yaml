# Build the lender calculator off the Coolify server and deploy the commit image.
substitutions:
  _IMAGE: europe-north1-docker.pkg.dev/personal-493517/apps/lender-calculator
  _COOLIFY_URL: https://coolify.teamofones.com
  _COOLIFY_APP: ekcs9ogzbmlam41o7bsamaso

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull $_IMAGE:latest || true
        DOCKER_BUILDKIT=1 docker build --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from $_IMAGE:latest -t $_IMAGE:$SHORT_SHA -t $_IMAGE:latest .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [-c, "docker push $_IMAGE:$SHORT_SHA && docker push $_IMAGE:latest"]

  - id: deploy
    name: gcr.io/cloud-builders/curl
    entrypoint: bash
    secretEnv: [COOLIFY_TOKEN]
    args:
      - -c
      - |
        set -euo pipefail
        curl -fsS -X PATCH -H "Authorization: Bearer $$COOLIFY_TOKEN" -H "Content-Type: application/json" \
          -d '{"docker_registry_image_tag":"$SHORT_SHA"}' "$_COOLIFY_URL/api/v1/applications/$_COOLIFY_APP" >/dev/null
        curl -fsS -H "Authorization: Bearer $$COOLIFY_TOKEN" "$_COOLIFY_URL/api/v1/deploy?uuid=$_COOLIFY_APP&force=false"

availableSecrets:
  secretManager:
    - versionName: projects/personal-493517/secrets/coolify-api-token/versions/latest
      env: COOLIFY_TOKEN

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
